name: Log a bet

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: log-bet-${{ github.event.issue.number || github.run_id }}   # one per bet (several bets at once were cancelling each other); the save step retries on conflicts
  cancel-in-progress: false

jobs:
  log:
    # only bets opened by the repo owner, with the form's "bet" label
    if: github.event.issue.user.login == github.repository_owner && contains(github.event.issue.labels.*.name, 'bet')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: pip install -q pandas
      - name: Record and save the bet
        # several bets logged at once used to collide here (Nov 1, 2026: five NHL bets failed with a merge conflict).
        # Each try starts from the newest saved file and re-adds this bet, so simultaneous bets queue up cleanly.
        run: |
          git config user.name "nhl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            python log_bet.py . "$GITHUB_EVENT_PATH"
            python bet_record.py . > /dev/null 2>&1 || true
            if [ -f state/my_bets.csv ]; then git add state/my_bets.csv; fi
            for f in state/bet_record.csv state/record_by_version.csv; do if [ -f "$f" ]; then git add "$f"; fi; done
            if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
            git commit -q -m "Log bet from issue #${{ github.event.issue.number }}"
            if git push -q; then exit 0; fi
            echo "Push failed (another save got there first); retrying."; sleep $((4 * i))
          done
          exit 1
      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f state/_bet_title.txt ]; then gh issue edit ${{ github.event.issue.number }} -R ${{ github.repository }} --title "$(cat state/_bet_title.txt)"; fi
          gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} --body-file state/_bet_reply.md
          gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }}
