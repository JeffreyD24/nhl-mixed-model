name: Probe Polymarket order book (one-time)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pm-book-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas
      - run: python tools/pm_book_probe.py
      - name: Save
        run: |
          git config user.name "nhl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/polymarket/samples/book_probe.json
          git diff --cached --quiet || git commit -q -m "Polymarket order book probe"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 10; done
