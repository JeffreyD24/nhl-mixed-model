name: Daily health check

on:
  schedule:
    - cron: "17 12 * * *"      # 8:17 AM EDT / 7:17 AM EST, before the morning run; always sends a phone summary
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: state-writes
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check pipelines
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python health_check.py . || echo "problems=1" >> "$GITHUB_OUTPUT"
      - name: Save report
        run: |
          git config user.name "health-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/health_latest.md state/health_log.csv
          git diff --cached --quiet || git commit -q -m "Health check $(TZ=America/New_York date '+%F %H:%M')"
          git pull --rebase -q && git push -q
      - name: Fail the run if anything is wrong
        if: steps.check.outputs.problems == '1'
        run: exit 1
