name: Odds feed (every market, DraftKings and FanDuel)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths: ["odds_feed.py", "feed_config.json", "feed_loop.sh", ".github/workflows/odds-feed.yml"]

permissions:
  contents: write

concurrency:
  group: odds-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q pandas numpy curl_cffi
      - name: Poll every market once a minute
        env:
          LOOP_SECONDS: ${{ github.event_name == 'push' && '240' || '3000' }}
        run: ./feed_loop.sh
