name: Log a limit

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: log-limit-${{ github.event.issue.number || github.run_id }}   # one per limit report; the save step retries on conflicts
  cancel-in-progress: false

jobs:
  log:
    # only limit reports opened by the repo owner, with the form's "limit" label
    if: github.event.issue.user.login == github.repository_owner && contains(github.event.issue.labels.*.name, 'limit')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: pip install -q pandas
      - name: Record and save the limit
        # same retry pattern as the bet logger: each try starts from the newest saved file and re-adds this report
        run: |
          git config user.name "nhl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            python log_limit.py . "$GITHUB_EVENT_PATH"
            if [ -f state/book_limits.csv ]; then git add state/book_limits.csv; fi
            if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
            git commit -q -m "Log limit from issue #${{ github.event.issue.number }}"
            if git push -q; then exit 0; fi
            echo "Push failed (another save got there first); retrying."; sleep $((4 * i))
          done
          exit 1
      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f state/_limit_title.txt ]; then gh issue edit ${{ github.event.issue.number }} -R ${{ github.repository }} --title "$(cat state/_limit_title.txt)"; fi
          gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} --body-file state/_limit_reply.md
          gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }}
