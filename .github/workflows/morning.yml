name: Morning model run

on:
  schedule:
    - cron: "41 15 * * *"      # 11:41 AM EDT / 10:41 AM EST: add last night's results, grade, refresh today's games
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: state-writes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          pip install -q -r requirements.txt
      - name: Run tracker
        run: python tracker.py .
      - name: Save results
        run: |
          git config user.name "nhl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state NHL_Live_Tracker.xlsx
          git diff --cached --quiet || git commit -m "Morning run $(TZ=America/New_York date +%F)"
          git pull --rebase -q && git push -q
