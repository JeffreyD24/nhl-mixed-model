name: Morning model run

on:
  schedule:
    - cron: "11 14 * * *"      # 10:11 AM EDT / 9:11 AM EST: results, grading, today's games, and tomorrow's picks before DraftKings opens (~11:20 AM)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: state-writes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          pip install -q -r requirements.txt
      - name: Run tracker (today's games)
        run: python tracker.py .
      - name: Lock tomorrow's picks before DraftKings posts its lines
        run: python tracker.py . --tomorrow
      - name: Grade Polymarket paper trades
        run: python polymarket.py . --grade || echo "Polymarket grading failed; it will try again tomorrow."
      - name: Shift charts for the last two days of games
        run: python shifts.py . || echo "Shift charts failed; they will be retried tomorrow."
      - name: NHL play-by-play and EDGE tracking stats
        run: python nhl_extra.py . || echo "NHL extra data failed; it will be retried tomorrow."
      - name: Save results
        run: |
          git config user.name "nhl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state research NHL_Live_Tracker.xlsx
          git diff --cached --quiet || git commit -m "Morning run $(TZ=America/New_York date +%F)"
          git pull --rebase -q && git push -q
