name: Evening model run (next day's games)

on:
  schedule:
    - cron: "33 2 * * *"       # 9:33 PM EST / 10:33 PM EDT: lock tomorrow's picks before most opening lines are posted
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: state-writes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          pip install -q -r requirements.txt
      - name: Predict tomorrow's games
        run: python tracker.py . --tomorrow
      - name: Save results
        run: |
          git config user.name "nhl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state NHL_Live_Tracker.xlsx
          git diff --cached --quiet || git commit -m "Evening run $(TZ=America/New_York date +%F)"
          git pull --rebase -q && git push -q
