name: Check reporters on Bluesky (one-time)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bluesky-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install -q pandas
      - name: Look up each reporter on Bluesky
        run: python tools/bluesky_check.py . nhl
      - name: Save
        run: |
          git config user.name "nhl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/media/bluesky_check.csv research/media/bluesky_starterpacks.csv
          git diff --cached --quiet || git commit -q -m "Bluesky check of NHL reporters"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 10; done
