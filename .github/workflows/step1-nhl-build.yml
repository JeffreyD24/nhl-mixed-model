name: Spreads step 1 NHL - rebuild history and holdout predictions
# Runs research/spreads/step1_nhl_build.py (pre-registration: research/spreads/STEP1_NHL_PREREG.md).
# Triggered by a push that changes the build script or the trigger file, or by hand.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - research/spreads/step1_nhl_build.py
      - research/spreads/step1_nhl_build.trigger
permissions:
  contents: write
concurrency:
  group: fetch-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Rebuild box/shots and walk-forward predictions (lag 1 and lag 0)
        run: python research/spreads/step1_nhl_build.py . 2>&1 | tee research/spreads/nhl_holdout/build_log.txt
      - name: Commit holdout predictions to main
        run: |
          git config user.name "nhl-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add research/spreads/nhl_holdout
          git diff --cached --quiet || git commit -q -m "Spreads step 1 NHL: holdout predictions (lag 1 / lag 0), 2021-22..2025-26"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 15; done
      - name: Commit the rebuilt box/shots history to main (data-source audit, Nov 5 2026; was a force-pushed orphan branch)
        run: |
          git config user.name "nhl-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/box_hist.csv.gz data/shots_hist.csv.gz
          git diff --cached --quiet || git commit -q -m "NHL box/shots history rebuilt $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 15; done
