name: Shift charts (backfill)
on:
  workflow_dispatch:
    inputs:
      from:
        description: "First date to download (YYYY-MM-DD)"
        default: "2026-10-07"
permissions:
  contents: write
jobs:
  shifts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas
      - run: python shifts.py . --from "${{ inputs.from }}"
      - name: Save
        run: |
          git config user.name "nhl-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add research/shifts
          git diff --cached --quiet && exit 0
          git commit -q -m "Shift charts backfill"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && exit 0; sleep 10; done
