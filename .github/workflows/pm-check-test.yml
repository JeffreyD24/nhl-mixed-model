name: Polymarket check test (one-time)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pm-check-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy
      - name: Run one Polymarket check
        run: python polymarket.py . --force
      - name: Show and save the book files
        run: |
          ls -la research/polymarket/ | grep book || true
          head -3 research/polymarket/book_*.csv | cut -c1-600 || true
          git config user.name "nhl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/polymarket/book_*.csv research/polymarket/samples
          git diff --cached --quiet || git commit -q -m "Polymarket order book test run"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 10; done
