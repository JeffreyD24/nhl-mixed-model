name: Log a bet
description: Record a bet you placed. It gets added to state/my_bets.csv and graded after the game.
title: "Bet: "
labels: ["bet"]
body:
  - type: input
    id: game_date
    attributes:
      label: Game date
      description: The day of the game (YYYY-MM-DD)
      placeholder: "2026-10-30"
    validations:
      required: true
  - type: input
    id: away
    attributes:
      label: Away team
      description: Abbreviation or name, e.g. NJ or Devils
    validations:
      required: true
  - type: input
    id: home
    attributes:
      label: Home team
      description: Abbreviation or name, e.g. VGK or Vegas
    validations:
      required: true
  - type: input
    id: market
    attributes:
      label: Market
      description: "moneyline, puck line, or total"
    validations:
      required: true
  - type: input
    id: pick
    attributes:
      label: Pick
      description: "For a total: over or under. Otherwise the team you bet, e.g. NJ"
    validations:
      required: true
  - type: input
    id: line
    attributes:
      label: Line (blank for moneyline)
      description: "Puck line: YOUR team's line (-1.5 or +1.5). Total: the number (6.5). Leave blank for a moneyline."
  - type: input
    id: odds
    attributes:
      label: Odds (American)
      description: "e.g. -130 or +115"
    validations:
      required: true
  - type: input
    id: stake
    attributes:
      label: Stake ($)
      description: Amount risked
    validations:
      required: true
  - type: input
    id: book
    attributes:
      label: Sportsbook (optional)
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
